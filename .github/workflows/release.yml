# Builds the Windows desktop installer and attaches it to a draft GitHub Release.
# Run it from the Actions tab, or push a tag matching the app version: git tag v0.1.0 && git push origin v0.1.0
# The release tag comes from desktop/src-tauri/tauri.conf.json ("version"); bump it there before releasing.
# The draft stays private until someone presses Publish on the Releases page.
name: Release desktop

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("${{ github.ref_name }}" -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match tauri.conf.json version v$version"
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop/src-tauri
          tauriScript: npx tauri
          tagName: v__VERSION__
          releaseName: Shoal v__VERSION__
          releaseDraft: true
          uploadUpdaterJson: false
          releaseBody: |
            Windows x64 installer for the Shoal desktop shell.

            The installer is only the window: the server runs from a Shoal checkout on your machine's Node 24.
            1. Install Node 24 and the CLIs you want (Claude Code, Codex CLI, agy), signed in.
            2. `git clone https://github.com/qianshuixia/Shoal` to a path without spaces.
            3. Run the installer and start Shoal. On first launch, pick the cloned folder; dependencies install automatically.

            The installer is not code-signed, so Windows SmartScreen may warn: choose More info -> Run anyway.
