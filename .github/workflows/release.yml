# Builds the self-contained Windows desktop installer and attaches it to a draft GitHub Release.
# Every push to main (except docs-only changes) rebuilds the draft for the current version, replacing its installer;
# it also runs from the Actions tab, or on a tag matching the app version: git tag v0.1.0 && git push origin v0.1.0
# The release tag comes from desktop/src-tauri/tauri.conf.json ("version"); bump it there to start a new release.
# The draft stays private until someone presses Publish on the Releases page.
name: Release desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', 'e2e/**', 'LICENSE']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  # A newer push to main supersedes a build still running; tag builds always finish.
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("${{ github.ref_name }}" -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match tauri.conf.json version v$version"
          }

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Cache the bundled Node runtime
        uses: actions/cache@v6
        with:
          path: .tmp/node-runtime
          key: node-runtime-${{ hashFiles('scripts/stage-desktop.mjs') }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop/src-tauri
          tauriScript: npx tauri
          tagName: v__VERSION__
          releaseName: Shoal v__VERSION__
          releaseDraft: true
          uploadUpdaterJson: false
          releaseBody: |
            Windows x64 installer for the Shoal desktop app.

            The installer is self-contained: it brings its own Node runtime, the server and the web UI, so you need no clone, Node or npm.
            1. Install the CLIs you want (Claude Code, Codex CLI, agy) and sign in to them.
            2. Run the installer and start Shoal.

            The installer is not code-signed, so Windows SmartScreen may warn: choose More info -> Run anyway.
